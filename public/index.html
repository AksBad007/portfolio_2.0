    <meta name="description" content="Welcome to the world of Akshat Arora, a seasoned Software Engineer. Dive into a showcase of innovative web solutions and seamless user experiences crafted with expertise and precision." />
    <title>Akshat Arora | Software Engineer</title>
    <style>
      * {
          margin: 0;
          padding: 0;
          border: 0;
          outline: 0;
          box-sizing: border-box;
          list-style: none;
          text-decoration: none;
      }

      .loader-fullscreen {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #191919;
      }

      .loader {
        display: inline-flex;
        gap: 10px;
      }

      .loader:before, .loader:after {
        content: "";
        height: 20px;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          linear-gradient(#222 0 0) top/100% 0% no-repeat,
          radial-gradient(farthest-side,#000 95%,#0000) 50%/8px 8px no-repeat
          #fff;
        animation: l9 4s infinite ease-in;
      }

      @keyframes l9 {
        0%  {background-size:100% 0%,8px 8px;background-position:top, 50% 50%}
        80% {background-size:100% 70%,8px 8px;background-position:top, 50% 70%}
        84%,
        100%{background-size:100% 0%,8px 8px;background-position:top, 50% 50%}
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loader-fullscreen">
        <div class="loader"></div>
      </div>
    </div>
  </body>
</html>
